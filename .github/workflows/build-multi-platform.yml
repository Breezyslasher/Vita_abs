name: Build

# ── Release version ─────────────────────────────────────────────────────────
# Version is read from the VERSION file in the repo root.
# Supports labels like "Beta 1.0.0" or plain "1.0.0".
# Tagged releases use this version as-is (e.g. "2.1.0").
# Non-release builds append the CI run number (e.g. "2.1.0.456").
# To override, use workflow_dispatch with a version input.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use APP_VERSION)'
        type: string
        default: ''
      platform:
        description: which platform to build
        type: choice
        options:
        - all
        - mingw64
        - macos
        - nx
        - psvita
        - ps4
        - flatpak
        - appimage
        - android
        - aur
        - deb
      pre_release:
        description: 'Upload artifacts to a GitHub pre-release'
        type: boolean
        default: false
      disable_builtin_nsp:
        description: disable builtin NSP
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# Build matrix
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_number: ${{ steps.resolve.outputs.version_number }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build version
        id: resolve
        run: |
          # Read base version from VERSION file
          APP_VERSION="$(cat VERSION | tr -d '\n')"
          BASE="${APP_VERSION#v}"
          BASE_NUM=$(echo "$BASE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [[ -z "$BASE_NUM" ]]; then
            BASE_NUM="0.0.0"
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${APP_VERSION}"
          else
            # Non-release: use base version + build number (e.g. 2.1.0.456)
            V="${BASE}.${{ github.run_number }}"
          fi
          V="${V#v}"
          # Extract numeric version for CMake / Vita / PS4 / deb (no labels)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Release: X.Y.Z only
            NUM="${BASE_NUM}"
          else
            # Non-release: X.Y.Z.build
            NUM="${BASE_NUM}.${{ github.run_number }}"
          fi
          # Filename/tag-safe version (spaces → hyphens)
          TAG="${V// /-}"

          # Android versionCode, derived from the numeric version so it moves
          # in lockstep with the version the in-app updater compares. It used
          # to be github.run_number, which grows on EVERY push - so a dev
          # build from a later run outranked a newer release, and Android
          # refused the update as a downgrade ("App not installed") even
          # though the updater offered it by version string. Encode
          # major.minor.patch.build as M*10^8 + m*10^6 + p*10^4 + (build%10^4).
          # The 10^8 base clears the old run-number codes, so a build with
          # this scheme supersedes any run-number install without a manual
          # reinstall; monotonic with version thereafter.
          IFS='.' read -r VC_MAJ VC_MIN VC_PAT VC_BLD <<< "${NUM}"
          VC_MAJ=$((10#${VC_MAJ:-0})); VC_MIN=$((10#${VC_MIN:-0}))
          VC_PAT=$((10#${VC_PAT:-0})); VC_BLD=$((10#${VC_BLD:-0} % 10000))
          VERSION_CODE=$((VC_MAJ*100000000 + VC_MIN*1000000 + VC_PAT*10000 + VC_BLD))

          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "version_number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Display version: ${V}"
          echo "Numeric version: ${NUM}"
          echo "Tag/filename version: ${TAG}"
          echo "Android versionCode: ${VERSION_CODE}"

  # ───────────────────────────────────────────────
  # Save version override to VERSION file
  # ───────────────────────────────────────────────
  save-version:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Update VERSION file
        run: |
          echo "${{ inputs.version }}" > VERSION
          echo "Updated VERSION to: ${{ inputs.version }}"
          cat VERSION
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update APP_VERSION to ${{ inputs.version }}"
          git push

  upload-release:
    needs: [ resolve-version, build-mingw, build-nx, build-macos, build-flatpak, build-appimage, build-aur, build-ps4, build-vita, build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download Assets
        uses: actions/download-artifact@v4
      # Same renaming as the pre-release job (scripts/ci/rename_release_assets.sh):
      # the asset names are a contract with the in-app updater's assetSuffix().
      - name: Rename artifacts for release
        env:
          FVER: ${{ needs.resolve-version.outputs.version_tag }}
        run: bash scripts/ci/rename_release_assets.sh
      # Detached ECDSA-P256 signatures beside each asset, verified by the
      # in-app updater before install (src/utils/update_verify.cpp). Signs
      # into release/, which the upload step globs, so the .sig files ship
      # automatically. No-op without the UPDATE_SIGNING_KEY secret.
      - name: Sign release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/ci/sign_release_assets.sh
      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: VitaABS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: release/*

  # ───────────────────────────────────────────────
  # Pre-release — manually triggered
  # ───────────────────────────────────────────────
  upload-prerelease:
    needs: [resolve-version, build-mingw, build-nx, build-macos, build-flatpak, build-appimage, build-aur, build-ps4, build-vita, build-android, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && inputs.pre_release == true }}
    steps:
      # Checkout FIRST: actions/checkout cleans the workspace, so downloading
      # artifacts before it would delete them.
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Rename artifacts for release
        env:
          FVER: ${{ needs.resolve-version.outputs.version_tag }}
        run: bash scripts/ci/rename_release_assets.sh
      # Detached ECDSA-P256 signatures beside each asset, verified by the
      # in-app updater before install (src/utils/update_verify.cpp). Signs
      # into release/, which the upload step globs, so the .sig files ship
      # automatically. No-op without the UPDATE_SIGNING_KEY secret.
      - name: Sign release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/ci/sign_release_assets.sh
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: VitaABS ${{ needs.resolve-version.outputs.version }}
          tag_name: ${{ needs.resolve-version.outputs.version_tag }}
          prerelease: true
          generate_release_notes: true
          files: release/*

  # ───────────────────────────────────────────────
  # PS Vita — VPK
  # ───────────────────────────────────────────────
  build-vita:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'psvita' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: PS Vita
    runs-on: ubuntu-latest
    container:
      # Pinned, not :latest. A rolling rebuild of :latest moved the base distro
      # (breaking "apk add") and swapped vdpm onto pacman in the same week —
      # both landed as build failures with no change on our side. 2026.08 is
      # the series switchfin builds its vita-packages against, so it matches
      # the assets below.
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Install build requirements
        run: |
          set -eu
          pkgs_apk="cmake ninja git zstd tar pkgconf"
          pkgs_apt="cmake ninja-build git zstd tar pkg-config"
          if   command -v apk     >/dev/null 2>&1; then apk update && apk add $pkgs_apk
          elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $pkgs_apt
          elif command -v dnf     >/dev/null 2>&1; then dnf install -y cmake ninja-build git zstd tar pkgconf-pkg-config
          elif command -v pacman  >/dev/null 2>&1; then pacman -Sy --noconfirm cmake ninja git zstd tar pkgconf
          else echo "No supported package manager found; relying on the image's toolchain"
          fi
          # wget is used by the dependency step and isn't in every base.
          if ! command -v wget >/dev/null 2>&1; then
            if   command -v apk     >/dev/null 2>&1; then apk add wget
            elif command -v apt-get >/dev/null 2>&1; then apt-get install -y --no-install-recommends wget
            fi
          fi
          for tool in cmake ninja git wget; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool missing after dependency install"; exit 1; }
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vita portlibs
        id: cache-vita-portlibs
        uses: actions/cache@v4
        with:
          path: portlib-cache
          # The key IS the pin list, so bumping a version misses and refetches.
          key: vita-portlibs-mbedtls-3.6.7-1_curl-8.16.0-3_ffmpeg-n6.0-3_mpv-0.36.0-3

      - name: Install Vita dependencies
        env:
          BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/vita-packages
        run: |
          set -eu
          # vita-packages is ROLLING — version bumps REPLACE assets, so stale
          # pins 404. Use *-vita.pkg.tar.xz (real pacman packages), NOT the
          # legacy *-arm.tar.xz bare sysroots (no .PKGINFO → "invalid or
          # corrupted package").
          fetch() {
            if command -v curl >/dev/null 2>&1; then
              curl -fL --retry 4 --retry-all-errors --speed-limit 102400 --speed-time 30 -o "$2" "$1"
            else
              wget --tries=4 --read-timeout=30 -O "$2" "$1"
            fi
          }
          mkdir -p portlib-cache
          for pkg in mbedtls-3.6.7-1 curl-8.16.0-3 ffmpeg-n6.0-3 mpv-0.36.0-3; do
            f="portlib-cache/${pkg}-vita.pkg.tar.xz"
            [ -s "$f" ] || fetch "$BASE_URL/${pkg}-vita.pkg.tar.xz" "$f"
          done
          cp portlib-cache/*-vita.pkg.tar.xz .

          # VitaSDK-repo packages go in by name with vdpm; LOCAL package files
          # must go through pacman --upgrade (vdpm-on-pacman's --sync rejects
          # file paths). Keep a legacy vdpm fallback for pre-pacman images.
          VDPM_NONINTERACTIVE=1 vdpm libass harfbuzz fribidi freetype libpng libwebp
          PACMAN="${VDPM_PACMAN:-$VITASDK/bin/pacman}"
          if [ -x "$PACMAN" ]; then
            "$PACMAN" \
              --config  "${VDPM_PACMAN_CONF:-$VITASDK/etc/pacman.conf}" \
              --root    "$VITASDK" \
              --dbpath  "$VITASDK/var/lib/pacman" \
              --cachedir "$VITASDK/var/cache/pacman/pkg" \
              --logfile "$VITASDK/var/log/pacman.log" \
              --noscriptlet --noconfirm --noprogressbar \
              --upgrade $PWD/*-vita.pkg.tar.xz
          else
            vdpm $PWD/*-vita.pkg.tar.xz          # legacy (pre-pacman) vdpm
          fi

          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_PSV=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-vita-${{ github.run_number }}
          path: build/VitaABS.vpk
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
             name: VitaABS-elf-${{ github.run_number }}
             path: build/VitaABS.velf


  # ───────────────────────────────────────────────
  # Android — switchfin-style APK build
  # ───────────────────────────────────────────────
  build-android:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27d
        link-to-sdk: true
    - name: Install dependency
      run: |
        # Prefer the fast Azure mirror but let apt fall back to the public
        # archive when a request Ign:/stalls (amd64 only; arm64 uses ports).
        if [ "$(dpkg --print-architecture)" = "amd64" ] && [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|^URIs: .*|URIs: mirror+file:/etc/apt/apt-mirrors.txt|' /etc/apt/sources.list.d/ubuntu.sources
        fi
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y ninja-build pkg-config meson nasm make zstd
    - name: Cache depends
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: jniLibs
        key: jniLibs-${{ hashFiles('scripts/android/Makefile') }}
    - name: Build packages
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        make -C scripts/android TMPDIR=${{ runner.temp }} download
        make -C scripts/android TMPDIR=${{ runner.temp }} ABI=armeabi-v7a \
          ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} build
        make -C scripts/android TMPDIR=${{ runner.temp }} ABI=arm64-v8a \
          ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} build
    - name: Bump version
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/platform/android/app/build.gradle
        versionCode: ${{ needs.resolve-version.outputs.version_code }}
        versionName: ${{ needs.resolve-version.outputs.version }}
    - name: Prepare Android sources and native dependencies
      run: |
        rm -rf app/platform/android/app/libs
        mkdir -p app/platform/android/app/libs
        for abi in armeabi-v7a arm64-v8a x86_64; do
          src_libdir="jniLibs/${abi}/lib"
          [ -d "${src_libdir}" ] || continue

          # Normalize optional linker names for CMake (-lpng/-lbz2/-lzstd).
          for missing in png bz2 zstd; do
            [ -e "${src_libdir}/lib${missing}.so" ] && continue
            [ -e "${src_libdir}/lib${missing}.a" ] && continue
            candidate="$(find "${src_libdir}" -maxdepth 1 -type f \( -name "lib${missing}*.so*" -o -name "lib${missing}*.a" \) | head -n1)"
            [ -n "${candidate}" ] || continue
            ln -sfn "$(basename "${candidate}")" "${src_libdir}/lib${missing}.so"
            echo "Aliased ${src_libdir}/lib${missing}.so -> $(basename "${candidate}")"
          done

          # Only stage runtime .so files for packaging to keep Gradle memory low.
          dst_libdir="app/platform/android/app/libs/${abi}"
          mkdir -p "${dst_libdir}"
          find "${src_libdir}" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -a {} "${dst_libdir}/" \;
        done
    - name: Build APK
      # build_libromfs_generator.sh must run before Gradle/CMake configure because
      # borealis's toolchain.cmake unconditionally checks that the generator binary
      # exists when PLATFORM_ANDROID is set — even though USE_LIBROMFS=OFF means
      # the generator is never actually used to embed anything.
      # Resources are loaded via APK assets (see build.gradle syncBorealisResources).
      run: |
        ${{ github.workspace }}/lib/borealis/build_libromfs_generator.sh
        # Forward the CI-resolved version into the native build (see
        # build.gradle externalNativeBuild) so the in-app version matches the
        # APK's versionName — without this the indirect Gradle->cmake build
        # never saw -DAPP_VERSION and fell back to the on-disk default.
        cd app/platform/android && ./gradlew assembleRelease \
          -PappVersion="${{ needs.resolve-version.outputs.version_number }}" \
          -PappDisplayVersion="${{ needs.resolve-version.outputs.version }}"
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: VitaABS-android-${{ github.run_number }}
        path: app/platform/android/app/build/outputs/apk/release/*.apk

  # ───────────────────────────────────────────────
  # AppImage — self-updating Linux format (x86_64 + aarch64)
  # ───────────────────────────────────────────────
  build-appimage:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'appimage' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: x86_64, runner: ubuntu-24.04 }
        - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set workspace permissions
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          # librtmp1 / libssh-gcrypt-4 are Recommends (not Depends) of
          # libavformat on Ubuntu 24.04 — without them ldd of the build's
          # libavformat reports "librtmp.so.1 => not found" and the bundling
          # loop below fails (and Steam Deck would fail the same way at
          # launch). Pull them in explicitly so they get bundled.
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            cmake ninja-build pkg-config patchelf \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libzstd-dev libdbus-1-dev \
            librtmp1 libssh-gcrypt-4 \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Build and bundle
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build

          # Bundle libmpv and every other non-system shared dep next to the
          # binary so distros that don't ship them (SteamOS, Bazzite, …) can
          # still launch it. Base-system libs (glibc, libstdc++, the OpenGL
          # stack, Wayland/X11, the loader) stay with the distro — shipping an
          # old glibc next to a newer host glibc is the classic startup crash.
          BUNDLE_DIR=build/lib
          mkdir -p "$BUNDLE_DIR"
          # `[-.]` after the prefix matches libwayland-client.so.0 (hyphen)
          # and libwayland.so.0 (dot) without catching e.g. libcurl for libc.
          EXCLUDE='^(/lib(64)?/ld-|.*/(libc|libm|libpthread|libdl|librt|libresolv|libutil|libnsl|libstdc\+\+|libgcc_s|libGL|libGLX|libEGL|libGLdispatch|libGLESv|libOpenGL|libvulkan|libX11|libxcb|libXext|libXrandr|libXi|libXinerama|libXcursor|libXrender|libXfixes|libwayland|libxkbcommon|libdbus|libsystemd|libudev|libdrm|libgbm)[-.]|linux-vdso\.so)'

          # Fixed-point walk: bundle the binary's deps, then each bundled
          # lib's deps too, until nothing new lands. Fail loudly on any
          # "not found" — the runtime loader would hit the same gap.
          declare -A bundled
          UNRESOLVED=""
          walk_deps() {
            local target="$1"
            while IFS= read -r raw; do
              local needed path
              needed=$(echo "$raw" | awk '{print $1}')
              path=$(echo "$raw" | awk '{print $3}')
              if [ "$path" = "not" ]; then
                UNRESOLVED+="${needed} (needed by $(basename "$target"))"$'\n'
                continue
              fi
              [[ -z "$path" || ! -f "$path" ]] && continue
              [[ "$path" =~ $EXCLUDE ]] && continue
              local name; name=$(basename "$path")
              if [ -z "${bundled[$name]+x}" ]; then
                cp -L "$path" "$BUNDLE_DIR/"
                bundled[$name]=1
                walk_deps "$BUNDLE_DIR/$name"
              fi
            done < <(ldd "$target" 2>/dev/null | awk '/=>/')
          }
          walk_deps build/VitaABS

          echo "Bundled libraries:"; ls -la "$BUNDLE_DIR" || true
          if [ -n "$UNRESOLVED" ]; then
            echo "::error::ldd reported unresolved dependencies on the build host"
            printf '%s' "$UNRESOLVED"
            exit 1
          fi

          # RPATH: the binary looks in $ORIGIN/lib first; every bundled lib
          # gets RPATH=$ORIGIN too, because DT_RUNPATH only resolves DIRECT
          # deps — libavformat wouldn't find the bundled librtmp otherwise.
          patchelf --set-rpath '$ORIGIN/../lib' build/VitaABS
          for so in "$BUNDLE_DIR"/*.so*; do
            [ -f "$so" ] || continue
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done
      - name: Package AppImage
        run: |
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/VitaABS"
          cp build/VitaABS "$APPDIR/usr/bin/VitaABS"
          cp -a build/lib/. "$APPDIR/usr/lib/"
          cp -r build/resources "$APPDIR/usr/share/VitaABS/resources"
          printf '%s\n' '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'cd "$HERE/usr/share/VitaABS" || exit 1' \
            'exec "$HERE/usr/bin/VitaABS" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VitaABS' \
            'Comment=Audiobookshelf client' 'Exec=VitaABS' 'Icon=VitaABS' \
            'Terminal=false' 'Categories=AudioVideo;Audio;Player;Network;' > "$APPDIR/VitaABS.desktop"
          cp app/platform/icon_desktop.png "$APPDIR/VitaABS.png"
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "VitaABS-${{ matrix.arch }}-${{ github.run_number }}.AppImage"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-appimage-${{ matrix.arch }}-${{ github.run_number }}
          path: VitaABS-${{ matrix.arch }}-${{ github.run_number }}.AppImage

  # ───────────────────────────────────────────────
  # Flatpak — org.freedesktop.Platform 24.08 (Flathub target)
  # ───────────────────────────────────────────────
  build-flatpak:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'flatpak' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The manifest is static YAML and can't see CI variables, and
      # flatpak-builder builds the app module from the checkout (source type:
      # dir) — so stamp the resolved version into VERSION and let the module's
      # cmake pick it up through the file fallback. Changing VERSION changes
      # the dir-source hash, so only the app module rebuilds; the cached
      # mpv/deps modules are untouched.
      - name: Stamp the CI-resolved version into VERSION
        run: echo "${{ needs.resolve-version.outputs.version }}" > VERSION
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: VitaABS.flatpak
          manifest-path: flatpak/io.github.breezyslasher.VitaABS.yaml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.breezyslasher.VitaABS.yaml') }}
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-flatpak-${{ github.run_number }}
          path: VitaABS.flatpak

  # ───────────────────────────────────────────────
  # Nintendo Switch — Matrix (opengl + deko3d)
  # ───────────────────────────────────────────────
  build-nx:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'nx' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: NX (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { driver: opengl, mpv_pkg: switch-libmpv-0.36.0-5-any.pkg.tar.zst, cmake_extra: "" }
        - { driver: deko3d, mpv_pkg: switch-libmpv-deko3d-0.36.0-5-any.pkg.tar.zst, cmake_extra: "-DUSE_DEKO3D=ON" }
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Switch portlibs
        uses: actions/cache@v4
        with:
          path: portlib-cache
          # Full pin list, incl. the per-leg mpv package, IS the key.
          key: switch-portlibs-hacBrewPack-3.05-1_libuam-master-1_dav1d-1.5.3-1_mbedtls-3.6.7-1_libssh2-1.11.1-1_ffmpeg-7.1.5-5_uchardet-0.0.8-1_${{ matrix.mpv_pkg }}

      - name: Install switchfin portlibs
        run: |
          BASE_URL="https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs"
          set -eu
          fetch() { curl -fL --retry 4 --retry-all-errors --speed-limit 102400 --speed-time 30 -o "$2" "$1"; }
          mkdir -p portlib-cache
          # FFmpeg ABI must match mpv: switchfin's switch-libmpv-0.36.0-5 was
          # built against switch-ffmpeg-7.1.5-5 (libavcodec 61.19.101), while
          # devkitPro's own FFmpeg is 61.19.100 — linking mpv against the
          # mismatched FFmpeg builds green and null-derefs the moment playback
          # touches libav*. Pull the WHOLE mpv → ffmpeg → tls stack (ffmpeg +
          # mbedtls + libssh2) plus uchardet (an mpv 0.36.0-5 dependency) from
          # switchfin so it's ABI-consistent.
          for pkg in hacBrewPack-3.05-1-x86_64.pkg.tar.zst \
                     libuam-master-1-any.pkg.tar.zst \
                     switch-dav1d-1.5.3-1-any.pkg.tar.zst \
                     switch-mbedtls-3.6.7-1-any.pkg.tar.zst \
                     switch-libssh2-1.11.1-1-any.pkg.tar.zst \
                     switch-ffmpeg-7.1.5-5-any.pkg.tar.zst \
                     switch-uchardet-0.0.8-1-any.pkg.tar.zst \
                     ${{ matrix.mpv_pkg }}; do
            [ -s "portlib-cache/$pkg" ] || fetch "$BASE_URL/$pkg" "portlib-cache/$pkg"
          done
          # Remove any pre-installed mpv so our pinned one wins, then install
          # all local files at once (dependency-consistent).
          dkp-pacman --noconfirm -Rdd switch-libmpv || true
          dkp-pacman --noconfirm -Rdd switch-libmpv-deko3d || true
          dkp-pacman --noconfirm -U portlib-cache/*.pkg.tar.zst
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DPLATFORM_SWITCH=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}" \
            ${{ matrix.cmake_extra }}
          cmake --build build
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          # Named VitaABS-nx-… because the release jobs collect VitaABS-nx-*
          name: VitaABS-nx-${{ matrix.driver }}-${{ github.run_number }}
          path: build/VitaABS.nro

  # ───────────────────────────────────────────────
  # PS4
  # ───────────────────────────────────────────────
  build-ps4:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'ps4' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: PS4
    runs-on: ubuntu-latest
    container:
      image: xfangfang/pacbrew:250221
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache PS4 portlibs
        uses: actions/cache@v4
        with:
          path: portlib-cache
          # Key IS the pin list → a version bump misses and refetches.
          key: ps4-portlibs-musl-1.5-3_mbedtls-2.28.10-2_sdl2-2.0.18-19_libcurl-7.80.0-5

      - name: Install PS4 portlibs
        env:
          BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/pacbrew
        run: |
          set -eu
          fetch() {
            curl -fL --retry 4 --retry-all-errors \
                 --speed-limit 102400 --speed-time 30 -o "$2" "$1"
          }
          mkdir -p portlib-cache
          # NOTE: mbedtls 2.28.x / sdl2 2.0.18 are DELIBERATE — that's what
          # OpenOrbis/pacbrew provides; don't "upgrade" them to match other
          # platforms. Assets are ps4-openorbis-<pkg>-any.pkg.tar.gz (gzip).
          for pkg in musl-1.5-3 mbedtls-2.28.10-2 sdl2-2.0.18-19 libcurl-7.80.0-5; do
            f="portlib-cache/ps4-openorbis-${pkg}-any.pkg.tar.gz"
            [ -s "$f" ] || fetch "$BASE_URL/ps4-openorbis-${pkg}-any.pkg.tar.gz" "$f"
          done
          pacman --noconfirm -U portlib-cache/*.pkg.tar.gz   # local files → -U
      - name: Build
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          cmake -B build -DPLATFORM_PS4=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Upload PS4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-ps4-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/**/*.pkg
            build/**/*.oelf

  # ───────────────────────────────────────────────
  # macOS matrix (explicit job name parity)
  # ───────────────────────────────────────────────
  build-macos:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: macOS (${{ matrix.tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { tag: Silicon, arch: arm64, target: "11.0", runner: macos-14 }
        - { tag: Intel, arch: x86_64, target: "11.0", runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: brew install cmake ninja pkg-config curl mbedtls mpv libass freetype harfbuzz fribidi libpng webp zstd glfw
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }} \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Bundle macOS dylibs
        run: |
          BIN="build/VitaABS"
          if [ ! -f "$BIN" ]; then
            echo "Expected binary not found: $BIN"
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          queue_file="$tmpdir/queue.txt"
          scanned_file="$tmpdir/scanned.txt"
          bundled_file="$tmpdir/bundled.txt"
          printf '%s\n' "$BIN" > "$queue_file"
          : > "$scanned_file"
          : > "$bundled_file"

          while [ -s "$queue_file" ]; do
            current="$(head -n 1 "$queue_file")"
            tail -n +2 "$queue_file" > "$queue_file.next" || true
            mv "$queue_file.next" "$queue_file"
            printf '%s\n' "$current" >> "$scanned_file"

            while IFS= read -r dep; do
              resolved_dep="$dep"
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*|@loader_path/*)
                  continue
                  ;;
                @rpath/*)
                  base_from_rpath="${dep#@rpath/}"
                  resolved_dep=""
                  for probe in \
                    "/usr/local/lib/$base_from_rpath" \
                    "/opt/homebrew/lib/$base_from_rpath" \
                    /usr/local/opt/*/lib/"$base_from_rpath" \
                    /opt/homebrew/opt/*/lib/"$base_from_rpath"; do
                    if [ -f "$probe" ]; then
                      resolved_dep="$probe"
                      break
                    fi
                  done
                  if [ -z "$resolved_dep" ]; then
                    echo "Skipping unresolved @rpath dependency: $dep"
                    continue
                  fi
                  ;;
              esac

              if [ ! -f "$resolved_dep" ]; then
                echo "Skipping missing dependency reference: $dep"
                continue
              fi

              base="$(basename "$resolved_dep")"
              target="build/$base"

              if ! grep -Fxq "$base" "$bundled_file"; then
                cp -f "$resolved_dep" "$target"
                install_name_tool -id "@executable_path/$base" "$target"
                install_name_tool -add_rpath "@executable_path" "$target" 2>/dev/null || true
                printf '%s\n' "$base" >> "$bundled_file"
                echo "Bundled $base (from $(basename "$current"))"
              fi

              install_name_tool -change "$dep" "@executable_path/$base" "$current"

              if ! grep -Fxq "$target" "$scanned_file" && ! grep -Fxq "$target" "$queue_file"; then
                printf '%s\n' "$target" >> "$queue_file"
              fi
            done < <(otool -L "$current" | tail -n +2 | awk '{print $1}')
          done

          install_name_tool -add_rpath "@executable_path" "$BIN" 2>/dev/null || true

          rm -rf "$tmpdir"
      - name: Package macOS DMG
        run: |
          APP_ROOT="build/dmg-root"
          APP_DIR="$APP_ROOT/VitaABS.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"
          RES_DIR="$APP_DIR/Contents/Resources"

          rm -rf "$APP_ROOT"
          mkdir -p "$MACOS_DIR" "$RES_DIR"

          cp -f build/VitaABS "$MACOS_DIR/VitaABS"
          cp -R build/resources "$MACOS_DIR/resources"
          cp -f build/*.dylib "$MACOS_DIR/" 2>/dev/null || true
          chmod +x "$MACOS_DIR/VitaABS"

          # Bundle icon. Finder, the Dock and the DMG window all read
          # CFBundleIconFile out of Contents/Resources; without it the .app
          # shows the blank generic-application icon.
          cp -f app/platform/icon_macos.icns "$RES_DIR/VitaABS.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>VitaABS</string>
            <key>CFBundleDisplayName</key><string>VitaABS</string>
            <key>CFBundleIdentifier</key><string>com.VitaABS.app</string>
            <key>CFBundleVersion</key><string>${{ needs.resolve-version.outputs.version_number }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.resolve-version.outputs.version }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>VitaABS</string>
            <key>CFBundleIconFile</key><string>VitaABS</string>
          </dict>
          </plist>
          PLIST

          hdiutil create \
            -volname "VitaABS" \
            -srcfolder "$APP_ROOT" \
            -ov \
            -format UDZO \
            "build/VitaABS-${{ matrix.tag }}.dmg"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-macos-${{ matrix.tag }}-${{ github.run_number }}
          path: |
            build/VitaABS
            build/VitaABS-*.dmg
            build/*.dylib
            build/resources/

  # ───────────────────────────────────────────────
  # MinGW matrix (x64/x86/arm64)
  # ───────────────────────────────────────────────
  build-mingw:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'mingw64' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: MinGW (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: x64, sys: mingw64, env: x86_64, runner: windows-latest }
        - { arch: arm64, sys: clangarm64, env: clang-aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          path-type: inherit
          cache: false
          release: ${{ contains(matrix.sys, 'arm64') }}
          install: >-
            mingw-w64-${{ matrix.env }}-ninja
            mingw-w64-${{ matrix.env }}-cc
            mingw-w64-${{ matrix.env }}-cmake
            mingw-w64-${{ matrix.env }}-glfw
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependency
        run: |
          for pkg in glfw-3.5.0-1 curl-8.16.0-1 mpv-0.41.0-1 libwebp-1.6.0-1; do
            curl -sLO https://github.com/dragonflylee/switchfin/releases/download/mingw-packages/${MINGW_PACKAGE_PREFIX}-${pkg}-any.pkg.tar.zst
          done
          pacman -U --noconfirm *.pkg.tar.zst
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON -DUSE_SYSTEM_GLFW=ON -DUSE_D3D11=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
      - name: Bundle runtime DLLs
        run: |
          EXE="build/VitaABS.exe"
          DLL_DIR="${MINGW_PREFIX}/bin"
          if [ ! -f "$EXE" ]; then
            echo "Expected binary not found: $EXE"
            exit 1
          fi
          if [ ! -d "$DLL_DIR" ]; then
            echo "Expected DLL directory not found: $DLL_DIR"
            exit 1
          fi

          queue=("$EXE")
          declare -A scanned
          declare -A bundled
          while [ ${#queue[@]} -gt 0 ]; do
            current="${queue[0]}"
            queue=("${queue[@]:1}")
            scanned["$current"]=1

            mapfile -t dlls < <(objdump -p "$current" | awk '/DLL Name:/{print $3}' | sort -u)
            for dll in "${dlls[@]}"; do
              candidate="$DLL_DIR/$dll"
              target="build/$dll"
              if [ -f "$candidate" ]; then
                if [ -z "${bundled[$dll]+x}" ]; then
                  cp -f "$candidate" "$target"
                  bundled["$dll"]=1
                  echo "Bundled $dll (from $(basename "$current"))"
                fi
                if [ -z "${scanned[$target]+x}" ]; then
                  queue+=("$target")
                fi
              fi
            done
          done

          echo "DLLs bundled into build/:"
          ls -1 build/*.dll
      - name: Upload mingw artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-mingw-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/VitaABS.exe
            build/*.dll
            build/resources/

  # ───────────────────────────────────────────────
  # Debian package-like build
  # ───────────────────────────────────────────────
  build-deb:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'deb' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: Deb build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential git pkg-config zstd \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libdbus-1-dev \
            wayland-protocols libwayland-bin libwayland-dev libxkbcommon-dev xorg-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
          PKGROOT="pkgroot"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/lib/VitaABS" "$PKGROOT/usr/share/VitaABS" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/pixmaps"
          install -m 755 build/VitaABS "$PKGROOT/usr/lib/VitaABS/VitaABS"
          {
            echo '#!/usr/bin/env sh'
            echo 'cd /usr/share/VitaABS || exit 1'
            echo 'exec /usr/lib/VitaABS/VitaABS "$@"'
          } > "$PKGROOT/usr/bin/VitaABS"
          chmod 755 "$PKGROOT/usr/bin/VitaABS"
          cp -r build/resources "$PKGROOT/usr/share/VitaABS/resources"
          install -m 644 app/platform/icon_desktop.png "$PKGROOT/usr/share/pixmaps/VitaABS.png"
          {
            echo '[Desktop Entry]'
            echo 'Type=Application'
            echo 'Name=VitaABS'
            echo 'Comment=Audiobookshelf client'
            echo 'Exec=VitaABS'
            echo 'Icon=VitaABS'
            echo 'Terminal=false'
            echo 'Categories=AudioVideo;Audio;Player;Network;'
          } > "$PKGROOT/usr/share/applications/VitaABS.desktop"
          ARCH="$(dpkg --print-architecture)"
          {
            echo "Package: VitaABS"
            echo "Version: ${{ needs.resolve-version.outputs.version_number }}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${ARCH}"
            echo "Maintainer: VitaABS CI <ci@VitaABS.local>"
            echo "Description: VitaABS desktop build artifact"
          } > "$PKGROOT/DEBIAN/control"
          dpkg-deb --build "$PKGROOT" "VitaABS-${{ github.run_number }}_${ARCH}.deb"
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-deb-${{ github.run_number }}
          path: VitaABS-${{ github.run_number }}_*.deb

  # ───────────────────────────────────────────────
  # AUR-like build
  # ───────────────────────────────────────────────
  build-aur:
    needs: [resolve-version]
    if: ${{ inputs.platform == 'aur' || inputs.platform == 'all' || github.event_name != 'workflow_dispatch' }}
    name: AUR build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential git pkg-config zstd \
            libcurl4-openssl-dev libmbedtls-dev libmpv-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libswresample-dev libswscale-dev libavutil-dev \
            libmp3lame-dev libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libwebp-dev libdbus-1-dev \
            wayland-protocols libwayland-bin libwayland-dev libxkbcommon-dev xorg-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DPLATFORM_DESKTOP=ON \
            -DAPP_VERSION=${{ needs.resolve-version.outputs.version_number }} \
            -DAPP_DISPLAY_VERSION="${{ needs.resolve-version.outputs.version }}"
          cmake --build build
          tar --zstd -cf VitaABS-${{ github.run_number }}.pkg.tar.zst -C build VitaABS resources
      - name: Upload aur artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaABS-aur-${{ github.run_number }}
          path: VitaABS-${{ github.run_number }}.pkg.tar.zst
